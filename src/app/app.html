<main class="container">
  <header>
    <h1>{{ pageTitle() }}</h1>
  </header>

  <!-- Form Input with Two-Way Binding -->
  <section class="input-group">
    <input 
      type="text" 
      [(ngModel)]="newTaskTitle" 
      (keyup.enter)="addTask()"
      placeholder="Enter a new task..."
    />
    <button (click)="addTask()" [disabled]="!newTaskTitle().trim()">
      Add Task
    </button>
  </section>

  <!-- Built-in Control Flow (@if / @for) -->
  <section class="task-list">
    @if (tasks().length > 0) {
      <ul>
        @for (task of tasks(); track task.id) {
          <li [class.done]="task.completed">
            <label>
              <input 
                type="checkbox" 
                [checked]="task.completed" 
                (change)="toggleTask(task.id)" 
              />
              <span>{{ task.title }}</span>
            </label>
          </li>
        }
      </ul>
    } @else {
      <p class="empty-state">No tasks yet. Add one above!</p>
    }
  </section>
</main>
